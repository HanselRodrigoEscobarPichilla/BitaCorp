<div class="whistleblowers-layout">
  <aside class="sidebar">
    <button 
      class="nav-btn" 
      [class.active]="activeTab === 'inicio'"
      (click)="setTab('inicio')">
      Inicio
    </button>
    <button 
      class="nav-btn" 
      [class.active]="activeTab === 'historial'"
      (click)="setTab('historial')">
      Historial
    </button>
  </aside>

  <main class="main-panel">
    <div class="top-bar">
      <button class="action-btn" *ngIf="activeTab === 'inicio'" (click)="crearBitacora()">Crear Bitácora</button>
      <button class="action-btn pill-btn" *ngIf="activeTab === 'inicio'" (click)="setTab('historial')">Historial</button>
      
      <div class="search-box">
        <input type="text" placeholder="Buscar..." />
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
    </div>

    <div class="content-body">
      <ng-container *ngIf="bitacoras.length > 0; else emptyState">
        <div class="card-bitacora" *ngFor="let item of bitacoras" (click)="verBitacora(item.id)">
          <div class="card-header">
            <div class="title-badge">{{ item.titulo }}</div>
            <div class="meta-badges">
              <span class="status-badge">Estado: {{ item.estado }}</span>
              <span class="date-badge">{{ item.fechaCreacion }}</span>
            </div>
          </div>

          <div class="card-body">
            <p>{{ item.descripcion }}</p>
          </div>

          <div class="card-footer">
            <button class="card-btn" (click)="editarBitacora(item.id, $event)">Actualizar</button>
            <button class="card-btn" (click)="eliminarBitacora(item.id, $event)">Eliminar</button>
          </div>
        </div>
      </ng-container>

      <ng-template #emptyState>
        <div class="empty-message">
          No hay bitácoras creadas...
        </div>
      </ng-template>
    </div>
  </main>
</div>

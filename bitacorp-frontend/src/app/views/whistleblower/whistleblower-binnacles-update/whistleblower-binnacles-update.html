<div class="binnacle-container">
  <div class="binnacle-card">
    <div class="card-header">
      <input type="text" class="input-title-badge" [(ngModel)]="form.titulo" />
      <div class="meta-badges">
        <span class="status-badge">Estado: Pendiente</span>
        <span class="date-badge">Fecha creacion</span>
      </div>
    </div>

    <div class="form-section">
      <textarea class="input-area" placeholder="Descripción..." [(ngModel)]="form.descripcion"></textarea>
      <input type="text" class="input-field" placeholder="Efectos..." [(ngModel)]="form.efectos" />
      <input type="text" class="input-field" placeholder="Lugar..." [(ngModel)]="form.lugar" />
      <input type="text" class="input-field" placeholder="Fecha de lo sucedido..." [(ngModel)]="form.fechaSucedido" />
    </div>

    <div class="section-block">
      <h3>Evidencias</h3>
      <div class="evidences-box">
        <div class="add-evidence-btn" (click)="fileInput.click()">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <input #fileInput type="file" multiple (change)="onFileSelected($event)" style="display:none">
        </div>

        <div class="file-grid">
          <div class="file-card">
            <button class="options-btn">⋮</button>
            <div class="file-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
              </svg>
            </div>
            <span class="file-name">ArchivoEjemplo.pdf</span>
          </div>

          <div class="file-card">
            <button class="options-btn">⋮</button>
            <div class="file-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
              </svg>
            </div>
            <span class="file-name">Video/Audio...pdf</span>
          </div>
        </div>
      </div>
    </div>

    <div class="section-block">
  <h3>Agresores</h3>
  <select class="input-field select-field" [(ngModel)]="form.tipoAgresor">
    <option value="" disabled selected hidden>Tipo de agresor...</option>
    <option value="Una persona">Una persona</option>
    <option value="Un grupo">Un grupo</option>
    <option value="Una organizacion">Una organizacion</option>
  </select>
  <textarea class="input-area small-area" placeholder="Descripcion del agresor: nombre, pronombre, aspecto, físico o etc..." [(ngModel)]="form.descripcionAgresor"></textarea>
</div>
      

    <div class="card-footer">
      <button class="card-btn" (click)="actualizar()">Actualizar</button>
      <button class="card-btn" (click)="cancelar()">Cancelar</button>
    </div>
  </div>
</div>
